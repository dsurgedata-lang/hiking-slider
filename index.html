<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; }
    .slider { position: relative; width: 100%; height: 100vh; }
    .slide {
      position: absolute;
      width: 100%; height: 100%;
      opacity: 0;
      transition: opacity 1s ease-in-out;
      background-size: cover;
      background-position: center;
    }
    .slide.active { opacity: 1; }
    /* ---- YOUR IMAGES ---- */
    .slide:nth-child(1)  { background-image: url('514229946_10162695319038609_4096690240755097163_n (1).jpg'); }
    .slide:nth-child(2)  { background-image: url('514377970_10162695319158609_1968763175771641040_n (1).jpg'); }
    .slide:nth-child(3)  { background-image: url('514609639_10162695318098609_8453948692842073377_n.jpg'); }
    .slide:nth-child(4)  { background-image: url('517466834_10162762621903609_627542234967933194_n.jpg'); }
    .slide:nth-child(5)  { background-image: url('517715145_10162762622158609_2906294257447703133_n.jpg'); }
    .slide:nth-child(6)  { background-image: url('517909504_10162762621913609_7549394194028125062_n.jpg'); }
    .slide:nth-child(7)  { background-image: url('571203212_10163240495313609_1005318103959418641_n.jpg'); }
    .slide:nth-child(8)  { background-image: url('PXL_20240929_161215852.jpg'); }
    .slide:nth-child(9)  { background-image: url('PXL_20240929_162811070 (2).jpg'); }
    .slide:nth-child(10) { background-image: url('PXL_20240929_164437673.jpg'); }
    .slide:nth-child(11) { background-image: url('PXL_20240929_164440189 (1).jpg'); }
    .slide:nth-child(12) { background-image: url('PXL_20240929_164440189.jpg'); }
    .slide:nth-child(13) { background-image: url('PXL_20250601_173124293~2 (1).jpg'); }
    /* ---- END IMAGES ---- */
    .arrow {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      background: rgba(0,0,0,0.4);
      color: white; font-size: 2rem;
      border: none; cursor: pointer;
      padding: 12px 18px; z-index: 10;
      border-radius: 4px;
    }
    .arrow.left { left: 16px; }
    .arrow.right { right: 16px; }
    .dots {
      position: absolute; bottom: 20px;
      width: 100%; text-align: center; z-index: 10;
    }
    .dot {
      display: inline-block;
      width: 12px; height: 12px; margin: 0 5px;
      background: rgba(255,255,255,0.5);
      border-radius: 50%; cursor: pointer;
      transition: background 0.3s;
    }
    .dot.active { background: white; }
  </style>
</head>
<body>
  <div class="slider" id="slider">
    <div class="slide active"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <button class="arrow left" onclick="changeSlide(-1)">&#10094;</button>
    <button class="arrow right" onclick="changeSlide(1)">&#10095;</button>
    <div class="dots" id="dots"></div>
  </div>
  <script>
    let current = 0;
    const slides = document.querySelectorAll('.slide');
    const dotsContainer = document.getElementById('dots');
    slides.forEach((_, i) => {
      const dot = document.createElement('span');
      dot.classList.add('dot');
      if (i === 0) dot.classList.add('active');
      dot.onclick = () => goTo(i);
      dotsContainer.appendChild(dot);
    });
    function goTo(n) {
      slides[current].classList.remove('active');
      document.querySelectorAll('.dot')[current].classList.remove('active');
      current = (n + slides.length) % slides.length;
      slides[current].classList.add('active');
      document.querySelectorAll('.dot')[current].classList.add('active');
    }
    function changeSlide(dir) { goTo(current + dir); }
    setInterval(() => changeSlide(1), 4000);
  </script>
</body>
</html>
